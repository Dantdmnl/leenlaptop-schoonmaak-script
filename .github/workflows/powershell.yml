name: Windows validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        shell: powershell
        run: |
          Install-PackageProvider NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser
          $toolsPath = Join-Path $env:RUNNER_TEMP 'leenlaptop-modules'
          Save-Module Pester -RequiredVersion 4.10.1 -Path $toolsPath -Force
          Save-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Path $toolsPath -Force
      - name: Parse and analyze PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module "$env:RUNNER_TEMP\leenlaptop-modules\PSScriptAnalyzer\1.24.0\PSScriptAnalyzer.psd1" -Force
          Get-ChildItem -Recurse -Include *.ps1,*.psm1 | ForEach-Object {
            $tokens = $null; $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
          $issues = @(Invoke-ScriptAnalyzer -Path . -Recurse -IncludeRule PSAvoidGlobalAliases,PSAvoidUsingConvertToSecureStringWithPlainText,PSAvoidUsingInvokeExpression,PSAvoidAssignmentToAutomaticVariable)
          if ($issues.Count) { $issues | Format-Table; throw 'ScriptAnalyzer failed' }
          Add-Type -Path .\WlanProfiles.cs
      - name: Isolated tests (Windows PowerShell 5.1)
        shell: powershell
        run: .\tests\Invoke-Tests.ps1 -PesterModulePath "$env:RUNNER_TEMP\leenlaptop-modules\Pester\4.10.1\Pester.psd1"
      - name: Install and update on disposable Windows runner
        shell: powershell
        run: .\tests\Invoke-WindowsIntegration.ps1
      - name: Build release archive
        shell: powershell
        run: .\tools\New-ReleaseArchive.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: LeenlaptopSchoonmaak-1.7.3
          path: dist/*
